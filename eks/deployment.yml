apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-bank-api-deployment
  labels:
    app: simple-bank-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-bank-api
  template:
    metadata:
      labels:
        app: simple-bank-api
    spec:
      containers:
        - name: simple-bank-api
          image: 449386169831.dkr.ecr.ap-south-1.amazonaws.com/simplebank:dccce2c7250458b7c4962b3861dcb67f5dc51c6a
          ports:
            - containerPort: 8080